<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b1b1b">
  <title>FITEC | Central</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{--blue:#1800b8;--yellow:#ffc400;--green:#079b00;--bg:#1b1b1b;--white:#f8f8f8}
    *{box-sizing:border-box}
    html{background:var(--bg)}
    body{margin:0;background:var(--bg);color:var(--white);font-family:Arial,Helvetica,sans-serif;min-height:100vh}
    .banner{width:100%;background:var(--blue);border-bottom:9px solid #123b12;line-height:0}
    .banner img{display:block;width:100%;height:auto;max-height:440px;object-fit:cover}
    main{width:min(100%,900px);margin:0 auto;padding:clamp(38px,10vw,112px) clamp(18px,4.2vw,42px) 48px}
    .menu{display:flex;flex-direction:column;gap:18px}
    .tile{position:relative;display:flex;align-items:center;gap:clamp(18px,4vw,42px);width:100%;min-height:clamp(112px,23vw,170px);padding:14px 20px 14px 38px;border:3px solid var(--green);border-radius:19px;background:var(--yellow);color:var(--blue);text-decoration:none;cursor:pointer;text-align:left;box-shadow:0 2px 0 rgba(0,0,0,.25);transition:transform .12s,filter .12s}
    .tile:active{transform:scale(.985);filter:brightness(.94)}
    .tile-icon{position:relative;z-index:1;display:grid;place-items:center;flex:0 0 clamp(78px,19vw,142px);width:clamp(78px,19vw,142px);height:clamp(78px,19vw,142px);border-radius:18px;background:var(--blue);color:var(--yellow);box-shadow:-13px 9px 0 var(--green);font-size:clamp(42px,10vw,76px);font-weight:800;line-height:1}
    .tile-label{flex:1;text-align:center;font-family:Impact,'Arial Narrow',system-ui,sans-serif;font-size:clamp(27px,6.8vw,66px);font-weight:900;letter-spacing:-1.2px;line-height:1.05;overflow-wrap:anywhere}
    .tile:last-child .tile-label{font-size:clamp(23px,5.8vw,53px)}
    .footer{padding:0 20px 26px;text-align:center;color:#aaa;font-size:12px}
    dialog{width:min(90%,460px);border:2px solid var(--green);border-radius:18px;background:#242424;color:#fff;padding:24px;box-shadow:0 18px 60px #0009}
    dialog::backdrop{background:#0009}
    dialog h2{margin:0 0 10px;color:var(--yellow)}
    dialog p{line-height:1.5;color:#ddd}
    .close{background:var(--yellow);color:var(--blue);border:0;border-radius:10px;padding:12px 18px;font-weight:800;font-size:15px}
    @media(min-width:700px){.banner img{max-height:500px}.tile{min-height:160px}.tile-label{font-size:62px}}
    @media(max-width:370px){.tile{padding:12px 12px 12px 22px;gap:16px}.tile-label{font-size:25px}.tile-icon{box-shadow:-8px 6px 0 var(--green)}}
  </style>
</head>
<body>
  <div class="banner"><img src="banner_fitec.png" alt="FITEC — Tux sobre as cores azul, amarelo e verde"></div>
  <main>
    <nav class="menu" aria-label="Menu principal da FITEC">
      <button class="tile" onclick="openDepartment('Programação','Desenvolvimento, código e projetos. O link do departamento será adicionado quando você fornecer o grupo ou canal correspondente.')">
        <span class="tile-icon" aria-hidden="true">&lt;/&gt;</span><span class="tile-label">Programação</span>
      </button>
      <button class="tile" onclick="openDepartment('Hacking','Estudos de cibersegurança ética, privacidade e defesa digital. O link do departamento será configurado depois.')">
        <span class="tile-icon" aria-hidden="true">›_</span><span class="tile-label">Hacking</span>
      </button>
      <button class="tile" onclick="openDepartment('Hardware','Computadores, eletrônica e componentes. O link do departamento será configurado depois.')">
        <span class="tile-icon" aria-hidden="true">▦</span><span class="tile-label">Hardware</span>
      </button>
      <button class="tile" onclick="returnToForum()">
        <span class="tile-icon" aria-hidden="true">➤</span><span class="tile-label">Voltar ao Fórum</span>
      </button>
    </nav>
  </main>
  <div class="footer">FITEC · Central Tecnológica</div>
  <dialog id="info"><h2 id="dialog-title">FITEC</h2><p id="dialog-text"></p><button class="close" onclick="document.getElementById('info').close()">Entendi</button></dialog>
  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) { tg.ready(); tg.expand(); }
    function openDepartment(name, description) {
      document.getElementById('dialog-title').textContent = name;
      document.getElementById('dialog-text').textContent = description;
      const dialog = document.getElementById('info');
      if (dialog.showModal) dialog.showModal(); else alert(name + '\n' + description);
    }
    function returnToForum() {
      // Substitua este endereço pelo link de convite do grupo/fórum principal da FITEC.
      const forumUrl = '';
      if (forumUrl && tg && tg.openTelegramLink) tg.openTelegramLink(forumUrl);
      else if (forumUrl) window.location.href = forumUrl;
      else openDepartment('Voltar ao Fórum', 'Para ativar este botão, precisamos colocar aqui o link de convite ou o endereço do fórum principal da FITEC.');
    }
  </script>
</body>
</html>
