<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FITEC | Central</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Playfair+Display:ital,wght@1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

  <header class="topo">
    <div class="faixa faixa-azul"></div>
    <div class="faixa faixa-amarela"></div>
    <div class="faixa faixa-verde"></div>
    <div class="sombra"></div>

    <img class="pinguim" src="pinguim.png" alt="Pinguim do FITEC">
    <h1 class="logo">FITEC<sup>TM</sup></h1>
  </header>

  <main class="menu">

    <a class="botao" href="https://t.me/SEU_CANAL_PROGRAMACAO">
      <span class="icone">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></svg>
      </span>
      <span class="texto">Programação</span>
    </a>

    <a class="botao" href="https://t.me/SEU_CANAL_HACKING">
      <span class="icone">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6l7 6-7 6M13 19h8"/></svg>
      </span>
      <span class="texto">Hacking</span>
    </a>

    <a class="botao" href="https://t.me/SEU_CANAL_HARDWARE">
      <span class="icone">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="6" y="6" width="12" height="12" rx="1"/>
          <rect x="9.5" y="9.5" width="5" height="5"/>
          <path d="M9 3v3M12 3v3M15 3v3M9 18v3M12 18v3M15 18v3M3 9h3M3 12h3M3 15h3M18 9h3M18 12h3M18 15h3"/>
        </svg>
      </span>
      <span class="texto">Hardware</span>
    </a>

    <a class="botao botao-voltar" href="https://t.me/SEU_FORUM" id="voltar">
      <span class="icone">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="cheio" d="M21 3L2.5 10.5l6.5 2.5 2.5 7.5 3-5 5 3.5z"/></svg>
      </span>
      <span class="texto">Voltar ao Fórum</span>
    </a>

  </main>

  <script>
    var tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor('#1a00a3');
      tg.setBackgroundColor('#1c1c1c');

      document.querySelectorAll('a.botao').forEach(function (a) {
        a.addEventListener('click', function (e) {
          if (a.id === 'voltar') {
            e.preventDefault();
            tg.close();
          } else if (a.href.indexOf('https://t.me/') === 0) {
            e.preventDefault();
            tg.openTelegramLink(a.href);
          }
        });
      });
    }
  </script>
</body>
